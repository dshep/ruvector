name: Publish @dshep/ruvector-core

# Builds the Node engine for all five platforms, checks on every platform that
# a closed store's file opens again, and publishes
# @dshep/ruvector-core plus its five @dshep/ruvector-core-<platform> packages to
# GitHub Packages. Builds the engine of the commit it runs on, never the
# default branch's.

on:
  # A pull request into a ledgerdb release line builds, checks and assembles,
  # and never publishes.
  pull_request:
    branches: ['ledgerdb-*']
    paths:
      - 'crates/ruvector-node/**'
      - 'crates/ruvector-core/**'
      - 'npm/packages/dshep-core/**'
      - '.github/workflows/publish-dshep-core.yml'
  # Pushing the tag dshep-core-v<upstream>-ledgerdb.<n> publishes that version
  # from the tagged commit. A publish cannot be taken back cleanly, so the tag
  # is the one deliberate act that starts it.
  push:
    tags: ['dshep-core-v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          # Built natively so the check below can load the binary; 22.04 keeps
          # the glibc floor the same as the linux-x64 build.
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          # Built on Apple Silicon; checked with an x64 Node under Rosetta.
          - host: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
          - host: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc

    name: Build ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: dshep-core-${{ matrix.settings.target }}

      - name: Install NAPI-RS CLI
        run: npm install -g @napi-rs/cli@^2.18.0

      - name: Build native module
        working-directory: npm/packages/core
        shell: bash
        run: npm run build:napi -- --target ${{ matrix.settings.target }}
        env:
          # A stripped macOS build was refused by a newer macOS loader
          # ("mis-aligned LINKEDIT string pool"); the unstripped one loads.
          CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(matrix.settings.platform, 'darwin') && 'false' || 'true' }}

      - name: Collect the binary
        shell: bash
        run: |
          SRC="npm/packages/core/index.${{ matrix.settings.platform }}.node"
          test -f "$SRC" || { echo "missing $SRC"; find npm/packages/core -name '*.node'; exit 1; }
          mkdir -p out
          cp "$SRC" out/ruvector.node

      - name: Setup x64 Node.js (darwin-x64)
        if: matrix.settings.platform == 'darwin-x64'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          architecture: x64

      - name: Check close releases the file
        shell: bash
        run: |
          echo "checking with node on $(node -p 'process.platform + "-" + process.arch')"
          node npm/packages/dshep-core/scripts/close-reopen-check.cjs out/ruvector.node

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bindings-${{ matrix.settings.platform }}
          path: out/ruvector.node
          if-no-files-found: error

  publish:
    name: Assemble and publish
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dshep'

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Test the assembler
        run: node --test npm/packages/dshep-core/scripts/assemble.test.mjs

      - name: Assemble packages
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#dshep-core-v}"
          else
            # A pull request names no version; assemble under the first counter
            # for this upstream version, as a dry run.
            VERSION="$(node -p "require('./npm/packages/core/package.json').version")-ledgerdb.1"
          fi
          node npm/packages/dshep-core/scripts/assemble.mjs "$VERSION" artifacts dist

      - name: Pack (dry run)
        run: |
          for dir in dist/*/; do (cd "$dir" && npm pack --dry-run); done

      - name: Publish platform packages, then the main package
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for dir in dist/*/; do
            [ "$dir" = "dist/main/" ] && continue
            (cd "$dir" && npm publish --tag latest)
          done
          (cd dist/main && npm publish --tag latest)
